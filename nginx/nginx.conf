# 참고용: 이 서비스는 EC2에서 자체 nginx 컨테이너를 띄우지 않습니다
# (docker-compose.prod.yml 참고 — 80/443 포트를 이미 쓰고 있는
#  vintage-house-reborn의 nginx와 충돌하기 때문).
# 대신 fastapi 컨테이너를 호스트의 8002 포트로 노출하고,
# EC2에 이미 떠 있는 nginx 설정에 아래 서버 블록을 추가해서
# localhost:8002로 프록시해야 합니다. (인증서는 certbot으로 별도 발급 필요)

server {
    listen 80;
    server_name pureun-api.ohdimode.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name pureun-api.ohdimode.com;

    ssl_certificate /etc/letsencrypt/live/pureun-api.ohdimode.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pureun-api.ohdimode.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
